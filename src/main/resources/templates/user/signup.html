<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
  <head>
    <meta charset="UTF-8"></meta>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/user/signup.css}">
    <script th:src="@{/webjars/jquery/jquery.min.js}" defer></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}" defer></script>
    <title>ユーザー登録</title>
  </head>
  <body>
    <form id="signup-form" action="@{/user/signup}" method="post" class="form-signup">
      <h1 class="text-center">ユーザー登録</h1>
      <div class="form-group">
        <label for="userId">ユーザID</label>
        <input type="text" class="form-control">
      </div>
      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" class="form-control">
      </div>
      <div class="form-group">
        <label for="userName">ユーザー名</label>
        <input type="text" class="form-control">
      </div>
      <div class="form-group">
        <label for="birthday">誕生日</label>
        <input type="text" class="form-control">
      </div>
      <div class="form-group">
        <label for="age">年齢</label>
        <input type="text" class="form-control">
      </div>
      <div class="form-group">
        <div th:each="item:${genderMap}" class="form-check-inline">
          <input type="radio" class="form-check-input" th:value="${item.value}"/>
          <label th:text="${item.key}" class="form-check-label"></label>
        </div>
      </div>
      <input type="submit" value="ユーザー登録" class="btn btn-primary w-100 mt-3"/>
  </body>
</html>
